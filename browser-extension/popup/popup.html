<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ResiTailor Extractor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      background: #fff;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #111;
    }
    p {
      font-size: 14px;
      color: #666;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 500;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button:active:not(:disabled) {
      background: #1e40af;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
    .status-success {
      color: #059669;
      font-weight: 500;
    }
    .status-error {
      color: #dc2626;
      font-weight: 500;
    }
    .status-loading {
      color: #2563eb;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>ResiTailor Extractor</h1>
    <p>Click the button to extract job posting</p>
    <button id="extract-btn">Extract Job</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
